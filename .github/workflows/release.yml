name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # Required for trusted publishing to npm

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Install zig
        run: sudo snap install zig --classic --beta

      - name: Build
        run: |
          cargo zigbuild -p mprocs --release --target=${{ matrix.target }}

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release/mprocs-${VERSION}-linux-${{ matrix.arch }}-musl
          cp target/${{ matrix.target }}/release/mprocs release/mprocs-${VERSION}-linux-${{ matrix.arch }}-musl/
          tar -czvf release/mprocs-${VERSION}-linux-${{ matrix.arch }}-musl.tar.gz \
            -C release/mprocs-${VERSION}-linux-${{ matrix.arch }}-musl \
            mprocs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mprocs-linux-${{ matrix.target }}
          path: release/*.tar.gz

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build -p mprocs --release --target=${{ matrix.target }}

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p release/mprocs-${VERSION}-darwin-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/mprocs release/mprocs-${VERSION}-darwin-${{ matrix.arch }}/
          tar -czvf release/mprocs-${VERSION}-darwin-${{ matrix.arch }}.tar.gz \
            -C release/mprocs-${VERSION}-darwin-${{ matrix.arch }} \
            mprocs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mprocs-darwin-${{ matrix.target }}
          path: release/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p mprocs --release

      - name: Package
        shell: powershell
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path "release\mprocs-${VERSION}-windows-x86_64"
          Copy-Item "target\release\mprocs.exe" "release\mprocs-${VERSION}-windows-x86_64\"
          tar.exe -a -c -f "release\mprocs-${VERSION}-windows-x86_64.zip" -C "release\mprocs-${VERSION}-windows-x86_64" mprocs.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mprocs-windows
          path: release/*.zip

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download artifacts for npm
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare npm package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd npm

          # Update version in package.json
          jq ".version = \"$VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json

          # Clean previous artifacts
          rm -rf mprocs-*

          # Extract Linux x64
          mkdir -p mprocs-${VERSION}-linux-x86_64-musl
          tar zxvf ../artifacts/mprocs-linux-x86_64-unknown-linux-musl/mprocs-${VERSION}-linux-x86_64-musl.tar.gz -C mprocs-${VERSION}-linux-x86_64-musl

          # Extract Linux ARM64
          mkdir -p mprocs-${VERSION}-linux-aarch64-musl
          tar zxvf ../artifacts/mprocs-linux-aarch64-unknown-linux-musl/mprocs-${VERSION}-linux-aarch64-musl.tar.gz -C mprocs-${VERSION}-linux-aarch64-musl

          # Extract macOS x64
          mkdir -p mprocs-${VERSION}-darwin-x86_64
          tar zxvf ../artifacts/mprocs-darwin-x86_64-apple-darwin/mprocs-${VERSION}-darwin-x86_64.tar.gz -C mprocs-${VERSION}-darwin-x86_64

          # Extract macOS ARM64
          mkdir -p mprocs-${VERSION}-darwin-aarch64
          tar zxvf ../artifacts/mprocs-darwin-aarch64-apple-darwin/mprocs-${VERSION}-darwin-aarch64.tar.gz -C mprocs-${VERSION}-darwin-aarch64

          # Extract Windows
          mkdir -p mprocs-${VERSION}-windows-x86_64
          unzip -o ../artifacts/mprocs-windows/mprocs-${VERSION}-windows-x86_64.zip -d mprocs-${VERSION}-windows-x86_64

          # Publish to npm with provenance (public scoped package, trusted publishing)
          npm publish --access public --provenance
