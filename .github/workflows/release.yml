name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build -p mprocs --release --target=${{ matrix.target }}

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCH=$(echo ${{ matrix.target }} | cut -d'-' -f1)
          mkdir -p release/mprocs-${VERSION}-linux-${ARCH}-musl
          cp target/${{ matrix.target }}/release/mprocs release/mprocs-${VERSION}-linux-${ARCH}-musl/
          tar -czvf release/mprocs-${VERSION}-linux-${ARCH}-musl.tar.gz \
            -C release/mprocs-${VERSION}-linux-${ARCH}-musl \
            mprocs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mprocs-linux-${{ matrix.target }}
          path: release/*.tar.gz

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build -p mprocs --release --target=${{ matrix.target }}

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ARCH=$(echo ${{ matrix.target }} | cut -d'-' -f1)
          mkdir -p release/mprocs-${VERSION}-darwin-${ARCH}
          cp target/${{ matrix.target }}/release/mprocs release/mprocs-${VERSION}-darwin-${ARCH}/
          tar -czvf release/mprocs-${VERSION}-darwin-${ARCH}.tar.gz \
            -C release/mprocs-${VERSION}-darwin-${ARCH} \
            mprocs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mprocs-darwin-${{ matrix.target }}
          path: release/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p mprocs --release

      - name: Package
        shell: powershell
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path "release\mprocs-${VERSION}-windows-x86_64"
          Copy-Item "target\release\mprocs.exe" "release\mprocs-${VERSION}-windows-x86_64\"
          tar.exe -a -c -f "release\mprocs-${VERSION}-windows-x86_64.zip" -C "release\mprocs-${VERSION}-windows-x86_64" mprocs.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mprocs-windows
          path: release/*.zip

  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
